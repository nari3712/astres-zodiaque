name: Build Android APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Éphéméride JPL DE440s (embarquée dans l'APK)
        run: |
          pip install skyfield numpy jplephem
          python -c "from skyfield.api import Loader; Loader('donnees_skyfield')('de440s.bsp')"
      - name: Buildozer
        run: |
          pip install --upgrade buildozer cython==0.29.37 virtualenv
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with: { name: AstresZodiaque-apk, path: bin/*.apk }

